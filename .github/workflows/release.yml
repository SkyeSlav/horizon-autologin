name: Release
# Builds the release files from source and attaches them to the release
# for the tag. Every v* tag ships both formats:
# - the .hnmod (Starling) is a source-only zip built with pure Python; the
#   game build happens in Starling, not here.
# - the .hmod (Horizon launcher / registry) is built with
#   cargo-horizon-mod against the SDK the manifest pins.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the build to"
        required: true
        default: "v1.1.2"
  push:
    tags: ["v*"]

jobs:
  build-hnmod:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/package.py
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: target/*.hnmod

  build-hmod:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      # Pinned to the tool revision this release was built and checked
      # with, so a later tool change cannot silently change the package.
      - run: cargo install --locked --git https://github.com/horizon-rust/horizon --rev 5a5aca6b21c7d8af9f7890a43a835cc06e4c21bf cargo-horizon-mod
      # The build fetches the pinned SDK into hmod/.horizon/sdk/ itself.
      - run: cd hmod && cargo horizon-mod build
      - run: cd hmod && cargo horizon-mod check target/horizon-mod/autologin.hmod
      # The tool names its output after the mod id; the release names it
      # with the version, like the .hnmod.
      - run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          mv hmod/target/horizon-mod/autologin.hmod "hmod/target/horizon-mod/autologin-${tag#v}.hmod"
      - run: cd hmod && cargo test -- --test-threads=1
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body: |
            ${{ env.VERSION }} detects login/register prompts in more places: the .hnmod now also reads title, subtitle and action-bar prompts, and the .hmod now also reads action-bar (overlay) chat lines. Title text has no hook in the mod API, so a title-only prompt is caught by the .hnmod only.

            Starling users: take `autologin-${{ env.VERSION }}.hnmod` — Starling 0.8.0 cannot load .hmod files. Horizon launcher users: take `autologin-${{ env.VERSION }}.hmod`.
          files: hmod/target/horizon-mod/*.hmod

name: Release
# Builds the .hnmod from source (pure Python, no Rust needed) and attaches
# it to the release for the tag. The .hnmod is a source-only zip; the game
# build happens on the user's own Starling build server, not here.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the build to"
        required: true
        default: "v1.0.0"
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/package.py
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: target/*.hnmod

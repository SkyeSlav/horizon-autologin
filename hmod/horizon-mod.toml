id = "autologin"
name = "Auto Login"
version = "1.1.7"
description = "Logs you in on join when a password is saved and consent is given, and watches for login/register prompts in chat, in the action bar and on the boss bar, per server."
authors = ["SkyeSlav"]
license = "MIT"
license_url = "https://github.com/SkyeSlav/horizon-autologin/blob/main/LICENSE"
homepage = "https://github.com/SkyeSlav/horizon-autologin"
issues = "https://github.com/SkyeSlav/horizon-autologin/issues"
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins, beside data/ and assets/.
api = "0.2"
side = "client"
# registries: "May add blocks, items, mob effects and entity types to your worlds".
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "0b14f8acfd97fa2c750e42795249dcc981178ca4"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

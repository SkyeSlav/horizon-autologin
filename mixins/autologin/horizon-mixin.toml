[mod]
id = "autologin"
version = "1.1.8"
priority = 100

# Pinned: Horizon 0.8.0 has no stable incoming-chat hook, so this mod reads
# the server's chat packets inside the game's multiplayer code
# (`game::remote`), which is not part of the stable hook points. The Starling
# build server rewrites this pin to the commit it builds anyway.
[compatibility]
horizon_revision = "ac874422ed8f892505ff73d67ae486ecfee7a516"

# The mod's own logic: prompts, passwords, delay, commands. No dependencies.
[[crate]]
id = "engine"
path = "engine"

# Every play packet, first: the login/register prompts the server sends.
[[injection]]
id = "packet"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::handle_packet"
helper = "packet.rs"
bindings = [
  { name = "packet", ty = "&horizon_protocol::packets::play::Clientbound", value = "&packet" },
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# Each client tick on a server: the delay runs out here, and the login or
# register command goes out.
[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::tick_remote"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "command"
hook = "command"
hook_version = 1
kind = "HEAD"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "commands"
hook = "commands"
hook_version = 1
kind = "HEAD"
helper = "commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<&'static str>", value = "&mut *commands" },
]

[[injection]]
id = "list"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
hook = "settings"
hook_version = 1
kind = "HEAD"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
hook = "settings_click"
hook_version = 1
kind = "HEAD"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
